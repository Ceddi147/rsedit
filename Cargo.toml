[package]
name = "rsedit"
version = "0.1.0"
edition = "2024"

[dependencies]
# No eframe: it only renders through the GPU (wgpu/glow), and the Vulkan or GL
# driver alone (radv + LLVM, ~50 MiB of libraries) outweighs the whole editor.
# rsedit draws on the CPU instead (`src/window.rs`) into a plain shared-memory
# window buffer.
egui = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    # Bundled monochrome emoji (icons in the explorer etc.); far lighter than system fonts.
    "monochrome_emoji_fonts",
] }
# `links`: open clicked links (Markdown preview) in the browser.
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "x11"] }
# CPU rasterizer for egui's meshes (vendored, see its Cargo.toml).
egui_software_backend = { path = "vendor/egui_software_backend" }
bytemuck = "1"
# Markdown preview. No image loading or regex: text, lists, tables and code only.
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17.2"
regex = "1"
serde_json = "1"
# Not used directly: egui-winit opens clicked links with it. `hardened` limits
# that to http(s), so a link in a Markdown file can't open local files or
# hand custom URL schemes to other applications.
webbrowser = { version = "1", features = ["hardened"] }
# Line diffs for the git gutter and the changes view.
similar = { version = "2", default-features = false, features = ["text"] }
# LF-only line breaks: line endings are converted on load/save, so every layer agrees on line numbers.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Oniguruma regexes: ~3x faster highlighting than the pure-Rust engine (needs a C compiler).
# Only the bundled grammars/themes; no HTML export or YAML/plist loading.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
# File tree icons are SVG files (assets/icons/), rasterized once per size.
# No text or embedded images: that leaves out font loading entirely.
resvg = { version = "0.50", default-features = false }

[features]
default = ["accessibility"]
# Screen reader support (AccessKit). Costs ~2 MiB and 3 threads; build with
# `--no-default-features` to leave it out.
accessibility = ["egui-winit/accesskit"]

# Dependencies (syntect, egui text layout) are far too slow unoptimized: an
# 800-line file took ~1.7s to first render in a plain dev build. Optimize them
# while keeping our own crate fast to compile.
[profile.dev.package."*"]
opt-level = 3

# Smaller, tighter release binary: fewer resident code pages, same speed.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
